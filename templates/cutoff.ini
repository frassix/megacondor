# CUTOFF: a flat spectrum over the energy range where the fluxes/*.dat file
# has flux (for the chosen theta/phi window). See the ranges with:
#     ./megacondor info
[simulation]
name      = my_cutoff_run        # output: <output_root>/<name>/
mode      = cutoff

particles = electron, positron   # one or more: photon pho511 electron positron proton neutron he4 muplus muminus
triggers  = 100000               # triggers for each particle (summed over its jobs)
jobs      = 20                   # parallel jobs for each particle

spectrum  = flat                 # flat | logflat. Most ranges span ~8 decades: with flat almost
                                 # every particle is >100 GeV, logflat gives equal counts per decade

theta     = 0 90                 # 'min max' range (deg) | one value = point source (0 = on-axis)
phi       = 0 360

first_interaction = any          # photons only: any | photo | compton | pair
