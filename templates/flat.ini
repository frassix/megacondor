# FLAT: a flat spectrum between emin and emax.
[simulation]
name      = my_flat_run          # output: <output_root>/<name>/
mode      = flat

particles = photon               # one or more: photon electron positron proton neutron he4 muplus muminus
triggers  = 100000               # triggers for each particle (summed over its jobs)
jobs      = 20                   # parallel jobs for each particle

emin      = 1000                 # keV
emax      = 10000                # keV
spectrum  = flat                 # flat | logflat (equal counts per energy decade)
binning   = none                 # none | linear | log: split emin..emax into one energy bin per job
#bin_width = 1000                # keV: linear bins of this width, one job per bin (then no 'jobs')

theta     = 0                    # 0 = on-axis | one value = point source | 'min max' = range (deg)
phi       = 0                    # one value with a single theta, 'min max' with a theta range

first_interaction = any          # photons only: any | photo | compton | pair
