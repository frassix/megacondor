# FLUX: the realistic spectrum (and angular distribution) of the fluxes/*.dat
# files, cut to emin..emax and to the theta/phi window.
[simulation]
name      = my_flux_run          # output: <output_root>/<name>/
mode      = flux

particles = proton, he4          # one or more: photon pho511 electron positron proton neutron he4 muplus muminus
triggers  = 100000               # total triggers (of the whole mix when combine = yes)
jobs      = 20                   # parallel jobs
combine   = yes                  # yes: one simulation with all particles at their real relative rates
                                 # no : a separate set of jobs for each particle

emin      = 1000                 # keV. Leave empty for the full range of the .dat file
emax      = 100000               # keV

theta     = 0 180                # 'min max' range (deg) | one value = point source (0 = on-axis)
phi       = 0 360

first_interaction = any          # photons only: any | photo | compton | pair
