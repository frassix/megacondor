# ============================================================================
#  Site settings: where things live on the cluster.
#  Change these only if something moved. Everything else is in the cards.
#
#  NOT configurable on purpose (see lib/megacondor/build.py, "FIXED SETTINGS"):
#    1 cpu / 2 GB memory / 200 MB disk per job, full MC info stored,
#    stop criterion = number of triggers.
# ============================================================================

[megalib]
# Sourced on every worker before running cosima.
setup = /data2/SIU/set_first_interaction/bin/source-megalib.sh
# Jobs need a HOME, otherwise ROOT crashes.
home  = /home/users/frassa

[cosima]
# Default geometry (a card can override it with: geometry = ...)
geometry   = /data2/SIU/geo/amegox/Geometry/ComPair_23/ComPair23.geo.setup
physics_em = LivermorePol
physics_hd = qgsp-bic-hp

[paths]
# Every run goes to <output_root>/<name>/. Must be a disk the workers can see:
# cosima writes its output straight there (the 200 MB job disk is too small).
output_root = /data2/SIU/sim
# Flux tables, relative to the repository. {particle} = photon, proton, ...
flux_files  = fluxes/{particle}_compair2_cosima.dat

[first_interaction]
# Line written into the .source file when a card sets first_interaction.
# {process} is replaced by one of the values below.
# This needs the patched MEGAlib in [megalib] setup: check that the keyword
# and the values match what that cosima build expects.
line    = SelectInteractionProcess {process}
photo   = PHOT
compton = COMP
pair    = PAIR
