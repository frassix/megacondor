# Charged hadrons (protons + alphas): flat spectrum over the energy range
# where the .dat flux files have flux (cutoff mode), half the triggers each.
[simulation]
name        = hadrons
mode        = cutoff                 # energy range taken from fluxes/*.dat
particles   = proton, he4
triggers    = 1750000                # per particle -> 3.5 million in total, 50/50
jobs        = 100                    # per particle -> 200 jobs, 17500 triggers each
spectrum    = flat

theta       = 0 180                  # whole sky
phi         = 0 360

output_root = /data2/SIU/sim/bkg/output     # -> /data2/SIU/sim/bkg/output/hadrons
log_dir     = logs                          # -> <repo>/logs/hadrons
