# Charged hadrons (protons + alphas), flat spectrum over the range of the
# .dat files, in 1 MeV bins, one job per bin, half the triggers each.
#
# The .dat files go from 11.3 keV to 897 GeV: 1 MeV bins over all of it would
# be ~900,000 jobs per particle with ~2 triggers each. emax caps the range;
# raise it (with more triggers) or see the log-binned variant at the bottom.
[simulation]
name        = hadrons
mode        = cutoff
particles   = proton, he4
triggers    = 1750000            # per particle: 3.5 million in total
spectrum    = flat
bin_width   = 1000               # keV -> one job per 1 MeV bin
emax        = 100000             # keV: 100 bins per particle, 17500 triggers per bin

theta       = 0 180              # whole sky, as in the .dat files
phi         = 0 360

output_root = /data2/SIU/sim/bkg/output     # -> /data2/SIU/sim/bkg/output/hadrons
log_dir     = logs                          # -> <repo>/logs/hadrons

# Full range instead (11.3 keV - 897 GeV) in 80 log bins, 21875 triggers each:
#   delete bin_width and emax, and set
#   binning = log
#   jobs    = 80
